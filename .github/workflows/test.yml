name: Test storefront
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run --frozen python -m unittest discover -s tests
      - run: uv run --frozen python evaluation/search.py
      - run: uv run --frozen python evaluation/roles.py
