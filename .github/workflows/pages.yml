name: Deploy live grocery search
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pulp-fictional-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --frozen --python 3.10
      - run: uv run --frozen python -m unittest discover -s tests
      - run: node --test tests/*.cjs
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        id: weights
        with:
          path: build/quant/student-Q4_K_M.gguf
          key: market-q4-v1-${{ hashFiles('experiments/market/adapter/*', 'scripts/merge_market_student.py', 'scripts/quantize_browser_model.sh') }}
      - name: Merge and quantize the trained adapter for browser inference
        if: steps.weights.outputs.cache-hit != 'true'
        env:
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '2'
        run: |
          uv pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          uv pip install 'transformers==4.52.4' 'peft==0.15.2' 'accelerate==1.7.0'
          uv run --no-sync python scripts/merge_market_student.py experiments/market/adapter build/merged
          bash scripts/quantize_browser_model.sh build/merged build/quant
      - name: Stage the self-contained market
        run: |
          mkdir -p build/site
          cp -a live/. build/site/
          digest=$(sha256sum build/quant/student-Q4_K_M.gguf | cut -d' ' -f1)
          uv run --no-sync python scripts/stage_browser_llm.py build/site build/quant/student-Q4_K_M.gguf --sha256 "$digest"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the live storefront
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
